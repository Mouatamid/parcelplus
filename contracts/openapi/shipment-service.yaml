openapi: 3.1.0
info:
  title: shipment-service
  version: 0.1.0
paths:
  /api/shipments:
    post:
      tags:
      - shipments
      summary: Create a shipment in status CREATED
      operationId: createShipment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
        required: true
      responses:
        '201':
          description: Shipment created
          headers:
            Location:
              description: URL of the new shipment
              style: simple
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        '400':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/shipments/{id}/status-changes:
    post:
      tags:
      - shipments
      summary: Move a shipment to the next status
      operationId: changeShipmentStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
        required: true
      responses:
        '200':
          description: Status changed; lastSequence is incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        '400':
          description: Validation failed, or the id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No shipment with this id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Transition not allowed (adds shipmentId, currentStatus, requestedStatus),
            or the shipment was changed concurrently
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/shipments/{id}:
    get:
      tags:
      - shipments
      summary: Get one shipment by id
      operationId: getShipment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The shipment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        '400':
          description: The id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No shipment with this id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  schemas:
    CreateShipmentRequest:
      type: object
      properties:
        originHub:
          type: string
          pattern: HUB-\d{3}
        destinationHub:
          type: string
          pattern: HUB-\d{3}
        serviceLevel:
          type: string
          enum:
          - STANDARD
          - EXPRESS
      required:
      - destinationHub
      - originHub
      - serviceLevel
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    ShipmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trackingCode:
          type: string
        originHub:
          type: string
        destinationHub:
          type: string
        serviceLevel:
          type: string
          enum:
          - STANDARD
          - EXPRESS
        status:
          type: string
          enum:
          - CREATED
          - PICKED_UP
          - IN_TRANSIT
          - OUT_FOR_DELIVERY
          - DELIVERED
          - EXCEPTION
        lastSequence:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChangeStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - CREATED
          - PICKED_UP
          - IN_TRANSIT
          - OUT_FOR_DELIVERY
          - DELIVERED
          - EXCEPTION
        hubCode:
          type: string
          pattern: HUB-\d{3}
      required:
      - hubCode
      - status
